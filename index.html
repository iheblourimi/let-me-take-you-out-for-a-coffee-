<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121011">
<title>A Coffee Invitation ☕️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&amp;family=Jost:wght@300;400;500&amp;family=Amiri:wght@400;700&amp;display=swap">
<style>
html,body{margin:0;height:100%;background:#121011;overflow:hidden}
.ly{width:100vw;height:100vh;height:100dvh}
.ly{--bg:#121011;--card:#171415;--ink:#F2EBDD;--ink2:#B5AB9B;--ink3:#7D746A;--champ:#D6C19C;--champ-line:rgba(214,193,156,.26);--ghost:rgba(242,235,221,.26);--line:rgba(242,235,221,.11);--wine:#6B1A2A;--wine-hi:#7E2234;--wine-glow:rgba(126,34,52,.55);--heart:#A3354A;--on-wine:#F6EFE3;--lightA:rgba(214,193,156,.085);--lightB:rgba(107,26,42,.20);--bloomA:rgba(126,34,52,.34);--bloomB:rgba(214,193,156,.07);--grainA:rgba(255,255,255,.035);--grainB:rgba(0,0,0,.32);--shadow:0 40px 90px -36px rgba(0,0,0,.9);--fi:14px;
position:relative;overflow:hidden;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:'Jost','Futura','Avenir Next',system-ui,sans-serif;font-weight:400;container:stage / size;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.ly.th-ivory{--bg:#F3EEE5;--card:#FBF8F2;--ink:#1D1819;--ink2:#5C534A;--ink3:#9A9185;--champ:#7A5C35;--champ-line:rgba(122,92,53,.30);--ghost:rgba(29,24,25,.30);--line:rgba(29,24,25,.11);--wine-glow:rgba(107,26,42,.32);--heart:#8E2438;--lightA:rgba(255,255,255,.7);--lightB:rgba(107,26,42,.07);--bloomA:rgba(126,34,52,.13);--bloomB:rgba(214,193,156,.22);--grainA:rgba(255,255,255,.4);--grainB:rgba(60,40,20,.05);--shadow:0 36px 80px -40px rgba(60,30,20,.45)}
.ly *{box-sizing:border-box}
.ly p,.ly h1,.ly h2{margin:0}

/* atmosphere */
.atmo{position:absolute;inset:0;pointer-events:none;z-index:0}
.light{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% -12%,var(--lightA),transparent 62%),radial-gradient(90% 55% at 50% 112%,var(--lightB),transparent 70%)}
.grain{position:absolute;inset:0;background-image:radial-gradient(var(--grainA) .6px,transparent .9px),radial-gradient(var(--grainB) .6px,transparent .9px);background-size:3px 3px,7px 5px;background-position:0 0,1px 2px}
.frame{position:absolute;inset:var(--fi);border:1px solid var(--champ-line)}
.frame::before,.frame::after{content:'';position:absolute;left:50%;width:7px;height:7px;margin-left:-3.5px;background:var(--bg);border:1px solid var(--champ-line);transform:rotate(45deg)}
.frame::before{top:-4px}.frame::after{bottom:-4px}
.bloom{position:absolute;left:50%;top:46%;width:140cqmin;height:140cqmin;margin:-70cqmin 0 0 -70cqmin;border-radius:50%;background:radial-gradient(circle,var(--bloomA) 0%,var(--bloomB) 36%,transparent 66%);animation:bloom 2.6s cubic-bezier(.22,1,.36,1) both,breathe 7s 2.6s ease-in-out infinite}
@keyframes bloom{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.82}}
.mote{position:absolute;bottom:-12px;border-radius:50%;background:var(--champ);opacity:0;animation:moteA 13s linear infinite}
.mote.b{animation-name:moteB}
@keyframes moteA{0%{opacity:0;transform:translate(0,0)}14%{opacity:.55}80%{opacity:.25}100%{opacity:0;transform:translate(26px,-104cqh)}}
@keyframes moteB{0%{opacity:0;transform:translate(0,0)}14%{opacity:.45}80%{opacity:.2}100%{opacity:0;transform:translate(-22px,-96cqh)}}

/* stage + screens */
.stage{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;padding:calc(var(--fi) + 34px) calc(var(--fi) + 14px) calc(var(--fi) + 22px)}
.stage::-webkit-scrollbar{display:none}
.scr{position:relative;width:100%;flex:1 0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;animation:scrIn 1s cubic-bezier(.22,1,.36,1) both}
.leaving .scr{animation:scrOut .55s cubic-bezier(.4,0,.2,1) both}
@keyframes scrIn{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes scrOut{from{opacity:1}to{opacity:0;transform:translateY(-6px);filter:blur(3px)}}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:var(--champ);padding-left:.34em}
.eyebrow.ar{font-family:'Amiri','Noto Naskh Arabic',serif;font-size:19px;color:var(--champ);letter-spacing:0;text-transform:none;padding:0;line-height:1.6}
.serif{font-family:'Cormorant Garamond','Cormorant',Garamond,'Times New Roman',serif}
.orn{display:block;width:92px;height:9px;color:var(--champ);opacity:.8}
.orn svg{display:block;width:100%;height:100%}

/* question */
.ask .head{display:flex;flex-direction:column;align-items:center;margin-top:3cqh}
.q{margin-top:22px!important;font-family:'Cormorant Garamond','Cormorant',Garamond,serif;font-weight:400;font-size:min(18cqw,10.5cqh);line-height:.9;letter-spacing:-.015em;color:var(--ink)}
.q span{display:block}
.qa{font-family:'Amiri','Noto Naskh Arabic','Geeza Pro',serif;font-weight:400;font-size:min(6.8cqw,4cqh);line-height:1.62;letter-spacing:0;max-width:13em;text-wrap:balance}
.eyebrow.greet{margin-top:14px}
.q.qa span{display:block}
.pnote{margin-top:10px!important;font-size:9px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);opacity:.6}
.q.qa em{font-style:normal;color:var(--champ);padding:0}
.qe{margin-top:12px!important;max-width:14em;font-family:'Cormorant Garamond',Garamond,serif;font-weight:400;font-size:24px;line-height:1.28;color:var(--ink);text-wrap:balance}
.qe em{font-style:italic;color:var(--champ)}
.q em{font-style:italic;font-weight:400;color:var(--champ);padding-right:.03em}
.rule{display:block;width:44px;height:1px;background:var(--champ);opacity:.55;margin:18px 0 14px}
.sub{font-family:'Cormorant Garamond',Garamond,serif;font-style:italic;font-weight:400;font-size:23px;line-height:1.25;color:var(--ink2);min-height:1.25em}
.sub.s0{animation:subA .7s ease both}.sub.s1{animation:subB .7s ease both}
@keyframes subA{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes subB{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.zone{position:relative;flex:1 1 auto;width:100%;min-height:180px;display:flex;align-items:center;justify-content:center;margin-top:14px}
.row{display:flex;align-items:center;justify-content:center;gap:14px}
.show-zone .zone{outline:1px dashed var(--champ);outline-offset:-1px}
.show-zone .zone::before{content:'Safe zone · NO never leaves this box';position:absolute;left:12px;top:10px;font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--champ)}

/* buttons */
.btn{appearance:none;-webkit-appearance:none;border:0;margin:0;font:inherit;cursor:pointer;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;height:54px;min-width:132px;padding:0 28px;border-radius:2px;font-family:'Jost',system-ui,sans-serif;font-weight:500;font-size:13px;letter-spacing:.3em;text-transform:uppercase;line-height:1;white-space:nowrap;touch-action:manipulation;user-select:none;-webkit-user-select:none;background:none;color:var(--ink)}
.btn .lbl{margin-right:-.3em}
.btn svg{width:16px;height:16px;flex:none}
.btn:focus-visible{outline:1px solid var(--champ);outline-offset:5px}
.yes-wrap{display:inline-flex;transition:transform .9s cubic-bezier(.22,1,.36,1)}
.yes{background:var(--wine);color:var(--on-wine);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 40px -18px var(--wine-glow);transition:background .35s ease,box-shadow .45s ease,transform .35s cubic-bezier(.22,1,.36,1)}
.yes::before{content:'';position:absolute;inset:4px;border:1px solid rgba(214,193,156,.32);border-radius:1px;transition:border-color .35s ease,inset .35s ease;pointer-events:none}
.yes:hover{background:var(--wine-hi);transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 24px 54px -16px var(--wine-glow)}
.yes:hover::before{border-color:rgba(214,193,156,.62);inset:5px}
.yes:active{transform:scale(.985);transition-duration:.1s}
.no{color:var(--ink2);box-shadow:inset 0 0 0 1px var(--ghost);transition:transform .75s cubic-bezier(.22,1,.36,1),color .3s ease,box-shadow .3s ease}
.no:hover{color:var(--ink)}
.no.gave{color:var(--ink);box-shadow:inset 0 0 0 1px var(--champ)}
.no.gave .lbl{animation:subA .7s ease both}
.ghostb{color:var(--champ);box-shadow:inset 0 0 0 1px var(--champ-line);transition:box-shadow .3s ease,color .3s ease}
.ghostb:hover{box-shadow:inset 0 0 0 1px var(--champ)}
.ghostb svg{transition:transform .35s cubic-bezier(.22,1,.36,1)}
.ghostb:hover svg{transform:translateX(3px)}
.link{height:44px;min-width:0;padding:0 6px;font-size:11px;letter-spacing:.26em;color:var(--ink2);transition:color .3s ease}
.link .lbl{position:relative;padding-bottom:5px}
.link .lbl::after{content:'';position:absolute;left:0;right:.26em;bottom:0;height:1px;background:currentColor;opacity:.45;transform-origin:left;transition:transform .4s cubic-bezier(.22,1,.36,1),opacity .3s}
.link:hover{color:var(--ink)}
.link:hover .lbl::after{opacity:.9}

/* "I knew" */
.knew{justify-content:center}
.knew-t{font-family:'Cormorant Garamond',Garamond,serif;font-weight:400;font-size:min(12.5cqw,7.4cqh);line-height:1.02;letter-spacing:-.01em;color:var(--ink);text-wrap:balance;animation:scrIn 1.4s .25s cubic-bezier(.22,1,.36,1) both}
.hrt{display:inline-block;width:.42em;height:.42em;margin-left:.2em;vertical-align:.06em;color:var(--heart);filter:drop-shadow(0 0 14px rgba(163,53,74,.55));animation:hbeat 3.2s 1.6s ease-in-out infinite}
.hrt svg{display:block;width:100%;height:100%}
@keyframes hbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.12)}24%{transform:scale(.98)}36%{transform:scale(1.06)}50%{transform:scale(1)}}
.knew-s{margin-top:20px!important;font-family:'Cormorant Garamond',Garamond,serif;font-style:italic;font-size:min(7.4cqw,30px);color:var(--ink2)}
.reveal{opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.22,1,.36,1),visibility 0s 1.1s}
.reveal.on{opacity:1;visibility:visible;transform:none;transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.22,1,.36,1),visibility 0s}
.knew .ghostb{margin-top:7cqh}

/* plan: date + time */
.p-head{display:flex;flex-direction:column;align-items:center}
.p-t{margin-top:16px!important;font-family:'Cormorant Garamond',Garamond,serif;font-weight:400;font-size:min(10cqw,5.6cqh);line-height:1.02;letter-spacing:-.01em;text-wrap:balance;max-width:12em}
.p-t em{font-style:italic;color:var(--champ)}
.p-s{margin-top:12px!important;font-size:15px;font-weight:300;letter-spacing:.02em;color:var(--ink2)}
.plan-body{width:100%;max-width:420px;margin-top:3.4cqh;display:flex;flex-direction:column;gap:26px;text-align:left}
.divider{display:none}
.cal-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cal-m{font-family:'Cormorant Garamond',Garamond,serif;font-weight:400;font-size:25px;letter-spacing:.01em}
.nav{width:44px;height:44px;min-width:0;padding:0;border-radius:50%;color:var(--ink2);transition:color .3s ease,box-shadow .3s ease}
.nav:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav:disabled{opacity:.28;cursor:default;box-shadow:none}
.nav svg{width:18px;height:18px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:14px 0 6px}
.wk span{text-align:center;font-size:10px;font-weight:500;letter-spacing:.2em;padding-left:.2em;color:var(--ink2)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.days.n1{animation:monN1 .5s cubic-bezier(.22,1,.36,1) both}.days.n2{animation:monN2 .5s cubic-bezier(.22,1,.36,1) both}
.days.p1{animation:monP1 .5s cubic-bezier(.22,1,.36,1) both}.days.p2{animation:monP2 .5s cubic-bezier(.22,1,.36,1) both}
@keyframes monN1{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes monN2{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes monP1{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes monP2{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.day{appearance:none;border:0;background:none;margin:0;padding:0;font:inherit;cursor:pointer;position:relative;height:min(44px,5.9cqh);display:flex;align-items:center;justify-content:center;font-family:'Jost',system-ui,sans-serif;font-size:15px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums;touch-action:manipulation}
.day::before{content:'';position:absolute;left:50%;top:50%;width:min(40px,100%);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;transition:background .3s ease,box-shadow .35s ease,transform .35s cubic-bezier(.22,1,.36,1)}
.day span{position:relative}
.day:hover::before{box-shadow:inset 0 0 0 1px var(--champ-line)}
.day:focus-visible{outline:none}
.day:focus-visible::before{box-shadow:inset 0 0 0 1px var(--champ)}
.day.today::after{content:'';position:absolute;left:50%;bottom:calc(50% - 15px);width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--champ)}
.day:disabled{color:var(--ink3);opacity:.5;cursor:default}
.day:disabled::before{box-shadow:none}
.day.sel{color:var(--on-wine)}
.day.sel::before{background:var(--wine);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--champ),0 10px 26px -6px var(--wine-glow);animation:selIn .45s cubic-bezier(.22,1,.36,1) both}
.day.sel::after{background:var(--on-wine)}
@keyframes selIn{from{transform:translate(-50%,-50%) scale(.7);opacity:.2}to{transform:translate(-50%,-50%);opacity:1}}
.tpanel{display:flex;flex-direction:column;gap:14px;animation:scrIn .8s cubic-bezier(.22,1,.36,1) both}
.t-wait{font-family:'Cormorant Garamond',Garamond,serif;font-style:italic;font-size:21px;color:var(--ink2);opacity:.75;text-align:center}
.t-q{font-family:'Cormorant Garamond',Garamond,serif;font-style:italic;font-weight:400;font-size:24px;line-height:1.15;color:var(--ink)}
.t-day{font-size:11px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--champ)}
.t-g{margin-top:6px!important;font-size:10px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--ink2)}
.times{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tm{appearance:none;border:0;margin:0;font:inherit;cursor:pointer;height:44px;border-radius:999px;background:none;box-shadow:inset 0 0 0 1px var(--ghost);color:var(--ink2);font-family:'Jost',system-ui,sans-serif;font-size:15px;font-weight:400;letter-spacing:.08em;font-variant-numeric:tabular-nums;transition:box-shadow .3s ease,color .3s ease,background .35s ease,transform .3s cubic-bezier(.22,1,.36,1);touch-action:manipulation}
.tm:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--champ)}
.tm:active{transform:scale(.97)}
.tm:focus-visible{outline:1px solid var(--champ);outline-offset:4px}
.tm:disabled{opacity:.3;cursor:default;box-shadow:inset 0 0 0 1px var(--line)}
.tm.sel{background:var(--wine);color:var(--on-wine);box-shadow:inset 0 0 0 1px var(--champ),0 12px 30px -12px var(--wine-glow)}
.tpanel .yes{align-self:flex-start;margin-top:8px}

/* invitation card */
.cardscr{justify-content:center;gap:34px}
.inv{width:min(100%,340px);padding:9px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);transform:rotate(-.6deg);animation:invIn 1.3s cubic-bezier(.22,1,.36,1) both}
@keyframes invIn{from{opacity:0;transform:translateY(22px) rotate(-2.2deg)}to{opacity:1;transform:rotate(-.6deg)}}
.inv-in{display:flex;flex-direction:column;align-items:center;gap:18px;padding:40px 22px 36px;border:1px solid var(--champ-line)}
.inv-d{font-family:'Cormorant Garamond',Garamond,serif;font-weight:400;font-size:34px;line-height:1.08;color:var(--ink)}
.inv-d span{display:block}
.inv-d em{font-style:italic;color:var(--ink2)}
.inv-time{font-family:'Cormorant Garamond',Garamond,serif;font-weight:300;font-size:60px;line-height:1;letter-spacing:.02em;font-variant-numeric:lining-nums;color:var(--champ)}
.inv-line{max-width:17em;font-family:'Cormorant Garamond',Garamond,serif;font-style:italic;font-size:19px;line-height:1.35;color:var(--ink2)}
.acts{display:flex;flex-direction:column;align-items:center;gap:10px;animation:scrIn 1s .5s cubic-bezier(.22,1,.36,1) both}
.acts .yes{min-width:250px}

/* final */
.final{justify-content:center}
.fin-t{font-family:'Cormorant Garamond',Garamond,serif;font-weight:400;font-size:min(16cqw,10cqh);text-wrap:balance;line-height:.95;letter-spacing:-.015em;animation:scrIn 1.6s .2s cubic-bezier(.22,1,.36,1) both}
.fin-t em{font-style:italic;color:var(--champ)}
.final .orn{margin:30px 0 26px;animation:scrIn 1.2s .8s ease both}
.fin-d{font-family:'Cormorant Garamond',Garamond,serif;font-size:28px;line-height:1.15;animation:scrIn 1.2s 1.05s cubic-bezier(.22,1,.36,1) both}
.fin-time{margin-top:6px!important;font-family:'Cormorant Garamond',Garamond,serif;font-weight:300;font-size:44px;line-height:1.1;letter-spacing:.02em;font-variant-numeric:lining-nums;color:var(--champ);animation:scrIn 1.2s 1.25s cubic-bezier(.22,1,.36,1) both}
.fin-s{margin-top:34px!important;font-family:'Cormorant Garamond',Garamond,serif;font-style:italic;font-size:23px;color:var(--ink2);animation:scrIn 1.4s 1.9s ease both}
.final .link{margin-top:6cqh;animation:scrIn 1s 2.8s ease both}

/* medium · tablets */
@container stage (min-width:600px){
 .ly{--fi:22px}
 .stage{padding:calc(var(--fi) + 6cqh) calc(var(--fi) + 40px) calc(var(--fi) + 40px)}
 .eyebrow{font-size:12px}
 .ask .head{margin-top:5cqh}
 .q{font-size:min(14cqw,9.4cqh)}
 .qa{font-size:min(6.4cqw,4.2cqh);max-width:12em}
 .qe{font-size:min(4.4cqw,3cqh);max-width:16em;margin-top:18px!important}
 .eyebrow.ar{font-size:23px}
 .rule{width:56px;margin:34px 0 22px}
 .sub{font-size:28px}
 .zone{max-width:640px;margin-top:24px}
 .row{gap:20px}
 .btn{height:58px;min-width:168px;font-size:13px;padding:0 34px}
 .link{height:44px;min-width:0;padding:0 6px;font-size:11px}
 .nav{width:44px;height:44px;min-width:0;padding:0}
 .knew-t{font-size:min(9cqw,7cqh)}
 .knew-s{font-size:34px}
 .p-t{font-size:min(8cqw,5cqh);max-width:none}
 .p-s{font-size:17px}
 .plan-body{max-width:520px;gap:34px}
 .cal-m{font-size:30px}
 .day{height:min(56px,5cqh);font-size:16px}
 .day::before{width:min(46px,100%)}
 .day.today::after{bottom:calc(50% - 17px)}
 .times{grid-template-columns:repeat(6,minmax(0,1fr))}
 .tm{height:46px;font-size:15px}
 .t-q{font-size:28px}
 .inv{width:420px}
 .inv-in{padding:54px 40px 48px;gap:22px}
 .inv-d{font-size:42px}
 .inv-time{font-size:76px}
 .inv-line{font-size:21px}
 .acts{flex-direction:row;gap:28px}
 .fin-t{font-size:min(15cqw,10cqh)}
 .fin-d{font-size:34px}
 .fin-time{font-size:56px}
 .fin-s{font-size:27px}
}
/* expanded · laptop & desktop */
@container stage (min-width:1024px){
 .ly{--fi:28px}
 .stage{padding:calc(var(--fi) + 5cqh) calc(var(--fi) + 64px)}
 .scr{justify-content:center}
 .eyebrow{font-size:12px;letter-spacing:.4em;padding-left:.4em}
 .ask .head{margin-top:0}
 .q{font-size:min(8.6cqw,15cqh);line-height:1}
 .q span{display:inline}
 .qa{font-size:min(3.9cqw,7cqh);line-height:1.62;max-width:16em}

<body>
<div class="ly" id="app">
<div class="atmo" aria-hidden="true"><div class="light"></div><div class="fx"></div><div class="grain"></div><div class="frame"></div></div>
<main class="stage"></main>
</div>
<script>
(function () {
  // ─── Where her answer is sent ───────────────────────────────────────
  var EMAIL = 'lourimiiheb@gmail.com';
  var ENDPOINT = 'https://formsubmit.co/ajax/' + EMAIL;

  var GIVE = 6;
  var SUBS = ['Be honest.', 'Really?', 'Are you sure?', 'I don’t believe you.', 'You’re making this difficult.', 'I admire the persistence.', 'Perhaps we should discuss this over coffee.'];
  var WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var WD_FR = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var MN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var MN_FR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  var TIMES = [];
  for (var th = 7; th <= 18; th++) { TIMES.push((th < 10 ? '0' : '') + th + ':00'); if (th < 18) TIMES.push((th < 10 ? '0' : '') + th + ':30'); }
  var HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.7l-1.2-1.1C6.1 15.4 3 12.6 3 9.1 3 6.3 5.2 4.1 8 4.1c1.6 0 3.1.7 4 1.9.9-1.2 2.4-1.9 4-1.9 2.8 0 5 2.2 5 5 0 3.5-3.1 6.3-7.8 10.5L12 20.7z"/></svg>';
  var ORN = '<span class="orn" aria-hidden="true"><svg viewBox="0 0 92 9" fill="none" stroke="currentColor" stroke-width="1"><path d="M0 4.5h38"/><path d="M54 4.5h38"/><path d="M46 .8l3.7 3.7L46 8.2l-3.7-3.7z"/></svg></span>';

  var root = document.getElementById('app');
  var stage = root.querySelector('.stage');
  var fx = root.querySelector('.fx');
  var S = { attempts: 0, dx: 0, dy: 0, flip: false, last: 0, day: null, time: null, vy: 0, vm: 0, sentYes: false };
  var timers = [];
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function $(sel) { return stage.querySelector(sel); }

  function today0() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime(); }
  function startMonth() { var n = new Date(); var y = n.getFullYear(), m = n.getMonth(); if (y < 2026 || (y === 2026 && m < 8)) { y = 2026; m = 8; } return { y: y, m: m }; }
  var sm0 = startMonth(); S.vy = sm0.y; S.vm = sm0.m;

  // ─── Email ──────────────────────────────────────────────────────────
  function send(fields) {
    var body = Object.assign({ _template: 'table', _captcha: 'false', 'Envoyé le': new Date().toLocaleString('fr-FR') }, fields);
    return fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.ok; }).catch(function () { return false; });
  }
  function frDate() { var d = new Date(S.day.y, S.day.m, S.day.d); return WD_FR[d.getDay()] + ' ' + S.day.d + ' ' + MN_FR[S.day.m] + ' ' + S.day.y; }

  // ─── Screens ────────────────────────────────────────────────────────
  var screens = {
    ask: function () {
      return '<section class="scr ask"><div class="head">' +
        '<p class="eyebrow">A little question</p>' +
        '<p class="eyebrow ar greet" lang="ar" dir="rtl">مَرْحَبًا أَيَّتُهَا الدُّكْتُورَةُ الكريمة 🌷</p>' +
        '<h1 class="q qa" lang="ar" dir="rtl"><span>دعيني أدعوكِ إلى فنجان قهوة،</span> <span>وتدعِينني إلى <em>ابتسامتكِ الجميلة</em>. ☕️✨</span></h1>' +
        '<p class="qe">Would you let me take you out for a <em>coffee</em>?</p>' +
        '<span class="rule" aria-hidden="true"></span><p class="sub s0" aria-live="polite">' + SUBS[0] + '</p></div>' +
        '<div class="zone"><div class="row"><div class="yes-wrap"><button class="btn yes" type="button" aria-label="Yes"><span class="lbl">Yes</span></button></div>' +
        '<button class="btn no" type="button" aria-label="No"><span class="lbl">No</span></button></div></div><p class="pnote">Anonymous visit statistics only</p></section>';
    },
    knew: function () {
      return '<section class="scr knew" role="status"><p class="knew-t">I knew you would.<span class="hrt" aria-hidden="true">' + HEART + '</span></p>' +
        '<p class="knew-s reveal">Now… let’s make it real.</p>' +
        '<button class="btn ghostb reveal" type="button"><span class="lbl">Continue</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15"/><path d="M14 7l5 5-5 5"/></svg></button></section>';
    },
    plan: function () {
      return '<section class="scr plan"><header class="p-head"><p class="eyebrow">The invitation</p><h2 class="p-t">Then, let’s make it a <em>meeting</em>.</h2><p class="p-s">Choose a day that feels right.</p></header>' +
        '<div class="plan-body"><div class="cal"><div class="cal-top">' +
        '<button class="btn nav" type="button" data-nav="-1" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>' +
        '<p class="cal-m" aria-live="polite"></p>' +
        '<button class="btn nav" type="button" data-nav="1" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>' +
        '<div class="wk" aria-hidden="true"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div><div class="days"></div></div>' +
        '<div class="divider" aria-hidden="true"></div><div class="tzone"></div></div></section>';
    },
    card: function () {
      var d = new Date(S.day.y, S.day.m, S.day.d);
      return '<section class="scr cardscr"><article class="inv" aria-label="Our evening"><div class="inv-in"><p class="eyebrow">Our evening</p>' + ORN +
        '<p class="inv-d"><span><em>' + WD[d.getDay()] + ',</em></span> <span>' + MN[S.day.m] + ' ' + S.day.d + '</span></p>' +
        '<p class="inv-time">' + S.time + '</p><p class="inv-line">A good beginning deserves a beautiful evening.</p></div></article>' +
        '<div class="acts"><button class="btn yes" type="button" data-act="official"><span class="lbl">Make It Official</span></button>' +
        '<button class="btn link" type="button" data-act="change"><span class="lbl">Change my choice</span></button></div></section>';
    },
    final: function () {
      var d = new Date(S.day.y, S.day.m, S.day.d);
      return '<section class="scr final" role="status"><h2 class="fin-t">It’s a <em>meeting</em>.</h2>' + ORN +
        '<p class="fin-d">' + WD[d.getDay()] + ', ' + MN[S.day.m] + ' ' + S.day.d + '</p><p class="fin-time">' + S.time + '</p>' +
        '<p class="fin-s">I’ll see you there.</p><p class="sent" aria-live="polite"></p></section>';
    }
  };

  var binders = {
    ask: function () {
      S.attempts = 0; S.dx = 0; S.dy = 0;
      var no = $('.no');
      $('.yes').addEventListener('click', function () { answeredYes(); });
      no.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse' && S.attempts < GIVE) dodge(e); });
      no.addEventListener('pointerdown', function (e) { if (S.attempts >= GIVE) return; if (e.pointerType !== 'mouse') e.preventDefault(); dodge(e); });
      no.addEventListener('click', function (e) { if (S.attempts >= GIVE) { answeredYes(); return; } if (Date.now() - S.last > 420) dodge(e); });
    },
    knew: function () {
      later(function () { var el = $('.knew-s'); if (el) el.classList.add('on'); }, 1500);
      later(function () { var el = $('.ghostb'); if (el) el.classList.add('on'); }, 2900);
      $('.ghostb').addEventListener('click', function () { go('plan'); });
    },
    plan: function () {
      stage.querySelectorAll('[data-nav]').forEach(function (b) { b.addEventListener('click', function () { shiftMonth(+b.getAttribute('data-nav')); }); });
      renderCal(''); renderTimes();
    },
    card: function () {
      $('[data-act="official"]').addEventListener('click', function () {
        go('final', 700);
        send({ _subject: '☕️ Elle a confirmé : ' + frDate() + ' à ' + S.time, 'Réponse': 'OUI — confirmé', 'Jour': frDate(), 'Heure': S.time, 'Clics sur NON': String(S.attempts) })
          .then(function (ok) { S.sendOk = ok; showSent(); });
      });
      $('[data-act="change"]').addEventListener('click', function () { go('plan'); });
    },
    final: function () { showSent(); }
  };

  function showSent() {
    var el = $('.sent'); if (!el || S.sendOk == null) return;
    if (S.sendOk) el.textContent = 'Your answer has been sent.';
    else el.innerHTML = '<a href="mailto:' + EMAIL + '?subject=' + encodeURIComponent('Our evening — ' + frDate() + ' ' + S.time) + '&body=' + encodeURIComponent('Oui ☕️ — ' + frDate() + ' à ' + S.time) + '">Send him my answer</a>';
  }
  function answeredYes() {
    go('knew', 750);
    if (!S.sentYes) { S.sentYes = true; send({ _subject: '☕️ Elle a dit OUI à ton invitation', 'Réponse': 'OUI', 'Clics sur NON': String(S.attempts) }); }
  }

  function go(name, wait) {
    clearTimers();
    root.classList.add('leaving');
    later(function () {
      root.classList.remove('leaving');
      stage.innerHTML = screens[name]();
      stage.scrollTop = 0;
      fx.innerHTML = (name === 'knew' || name === 'final') ? '<div class="bloom"></div>' : '';
      if (name === 'final') {
        var m = ''; for (var i = 0; i < 16; i++) m += '<span class="mote' + (i % 2 ? ' b' : '') + '" style="left:' + (4 + (i * 37) % 92) + '%;width:' + (2 + i % 3) + 'px;height:' + (2 + i % 3) + 'px;animation-delay:' + (i * 0.9).toFixed(1) + 's;animation-duration:' + (11 + (i % 5) * 1.6) + 's"></span>';
        fx.innerHTML += m;
      }
      binders[name]();
    }, wait || 520);
  }

  // ─── The NO button ──────────────────────────────────────────────────
  function dodge(ev) {
    var now = Date.now(); if (now - S.last < 320) return; S.last = now;
    if (S.attempts >= GIVE) return;
    var a = ++S.attempts;
    var no = $('.no'), zone = $('.zone'), yw = $('.yes-wrap'), sub = $('.sub');
    sub.textContent = SUBS[a]; sub.className = 'sub s' + (a % 2);
    yw.style.transform = 'scale(' + (1 + a * 0.014).toFixed(3) + ')';
    if (a >= GIVE) {
      no.style.transform = 'none'; no.classList.add('gave'); no.setAttribute('aria-label', 'Fine, yes');
      no.querySelector('.lbl').textContent = 'Fine — yes'; return;
    }
    var zw = zone.clientWidth, zh = zone.clientHeight, bw = no.offsetWidth, bh = no.offsetHeight;
    var bx = no.offsetLeft, by = no.offsetTop, cx = bx + S.dx, cy = by + S.dy, pad = 12;
    var g = 1 + a * 0.014, yW = yw.offsetWidth * g, yH = yw.offsetHeight * g;
    var ycx = yw.offsetLeft + yw.offsetWidth / 2, ycy = yw.offsetTop + yw.offsetHeight / 2;
    var yr = { l: ycx - yW / 2 - 22, r: ycx + yW / 2 + 22, t: ycy - yH / 2 - 18, b: ycy + yH / 2 + 18 };
    var px = null, py = null;
    if (ev && ev.clientX != null) { var zr = zone.getBoundingClientRect(); px = ev.clientX - zr.left; py = ev.clientY - zr.top; }
    var minD = a === 1 ? 80 : Math.min(zw, zh) * 0.3 + 40, maxD = a === 1 ? 180 : 1e9, best = null;
    for (var i = 0; i < 80; i++) {
      var tx = pad + Math.random() * Math.max(0, zw - bw - pad * 2);
      var ty = pad + Math.random() * Math.max(0, zh - bh - pad * 2);
      if (tx < yr.r && tx + bw > yr.l && ty < yr.b && ty + bh > yr.t) continue;
      if (px != null && px > tx - 40 && px < tx + bw + 40 && py > ty - 40 && py < ty + bh + 40) continue;
      var d = Math.hypot(tx - cx, ty - cy);
      if (d < minD || d > maxD) { if (!best) best = [tx, ty]; continue; }
      best = [tx, ty]; break;
    }
    if (best) { S.dx = Math.round(best[0] - bx); S.dy = Math.round(best[1] - by); }
    var rot = Math.round((Math.random() - .5) * 80) / 10, sc = a >= 4 ? 0.96 : 1;
    no.style.transform = 'translate(' + S.dx + 'px,' + S.dy + 'px) rotate(' + rot + 'deg) scale(' + sc + ')';
  }
  window.addEventListener('resize', function () {
    var no = $('.no'), zone = $('.zone'); if (!no || !zone || (!S.dx && !S.dy) || S.attempts >= GIVE) return;
    var x = no.offsetLeft + S.dx, y = no.offsetTop + S.dy;
    var nx = Math.max(10, Math.min(x, zone.clientWidth - no.offsetWidth - 10)), ny = Math.max(10, Math.min(y, zone.clientHeight - no.offsetHeight - 10));
    S.dx = Math.round(nx - no.offsetLeft); S.dy = Math.round(ny - no.offsetTop);
    no.style.transform = 'translate(' + S.dx + 'px,' + S.dy + 'px)';
  });

  // ─── Calendar + time ────────────────────────────────────────────────
  var mflip = false;
  function shiftMonth(delta) {
    var sm = startMonth(), lo = sm.y * 12 + sm.m, idx = S.vy * 12 + S.vm + delta;
    if (idx < lo || idx > lo + 11) return;
    S.vy = Math.floor(idx / 12); S.vm = idx % 12; mflip = !mflip;
    renderCal(delta > 0 ? 'n' : 'p');
  }
  function renderCal(dir) {
    var t0 = today0(), sm = startMonth(), lo = sm.y * 12 + sm.m, idx = S.vy * 12 + S.vm;
    $('.cal-m').textContent = MN[S.vm] + ' ' + S.vy;
    $('[data-nav="-1"]').disabled = idx <= lo; $('[data-nav="1"]').disabled = idx >= lo + 11;
    var off = (new Date(S.vy, S.vm, 1).getDay() + 6) % 7, dim = new Date(S.vy, S.vm + 1, 0).getDate(), h = '';
    for (var i = 0; i < off; i++) h += '<span aria-hidden="true"></span>';
    for (var d = 1; d <= dim; d++) {
      var dt = new Date(S.vy, S.vm, d), past = dt.getTime() < t0, isT = dt.getTime() === t0;
      var on = !!(S.day && S.day.y === S.vy && S.day.m === S.vm && S.day.d === d);
      h += '<button class="day' + (on ? ' sel' : '') + (isT ? ' today' : '') + '" type="button" data-d="' + d + '"' + (past ? ' disabled' : '') + ' aria-pressed="' + on + '" aria-label="' + WD[dt.getDay()] + ', ' + MN[S.vm] + ' ' + d + (isT ? ', today' : '') + '"><span>' + d + '</span></button>';
    }
    var days = $('.days'); days.className = 'days' + (dir ? ' ' + dir + (mflip ? '1' : '2') : ''); days.innerHTML = h;
    days.querySelectorAll('.day').forEach(function (b) {
      b.addEventListener('click', function () {
        S.day = { y: S.vy, m: S.vm, d: +b.getAttribute('data-d') };
        if (S.time && isPast(S.time)) S.time = null;
        renderCal(''); renderTimes();
        setTimeout(function () { if (stage.scrollHeight > stage.clientHeight + 4) stage.scrollTo({ top: stage.scrollHeight, behavior: 'smooth' }); }, 80);
      });
    });
  }
  function isPast(t) {
    if (!S.day) return false;
    var n = new Date(); if (new Date(S.day.y, S.day.m, S.day.d).getTime() !== today0()) return false;
    return (+t.slice(0, 2)) * 60 + (+t.slice(3)) <= n.getHours() * 60 + n.getMinutes();
  }
  function renderTimes() {
    var tz = $('.tzone');
    if (!S.day) { tz.innerHTML = '<p class="t-wait">First, a day.</p>'; return; }
    var d = new Date(S.day.y, S.day.m, S.day.d);
    function group(list) { return list.map(function (t) { var off = isPast(t), on = S.time === t; return '<button class="tm' + (on ? ' sel' : '') + '" type="button" data-t="' + t + '"' + (off ? ' disabled' : '') + ' aria-pressed="' + on + '">' + t + '</button>'; }).join(''); }
    var had = !!tz.querySelector('.tpanel');
    tz.innerHTML = '<div class="tpanel"' + (had ? ' style="animation:none"' : '') + '><p class="t-day">' + WD[d.getDay()] + ' · ' + MN[S.day.m] + ' ' + S.day.d + '</p>' +
      '<p class="t-q">What time should we meet?</p>' +
      '<p class="t-g">Morning</p><div class="times">' + group(TIMES.filter(function (t) { return +t.slice(0, 2) < 12; })) + '</div>' +
      '<p class="t-g">Afternoon</p><div class="times">' + group(TIMES.filter(function (t) { return +t.slice(0, 2) >= 12; })) + '</div>' +
      (S.time ? '<button class="btn yes" type="button" data-go><span class="lbl">See our meeting</span></button>' : '') + '</div>';
    tz.querySelectorAll('.tm').forEach(function (b) {
      b.addEventListener('click', function () { S.time = b.getAttribute('data-t'); renderTimes(); clearTimers(); later(function () { go('card'); }, 850); });
    });
    var g = tz.querySelector('[data-go]'); if (g) g.addEventListener('click', function () { go('card'); });
  }

  stage.innerHTML = screens.ask(); binders.ask();
})();
</script>
</body>
</html>
